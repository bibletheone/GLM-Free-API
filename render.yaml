services:
  - type: web
    name: glm-free-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: AUTH_TOKEN
        generateValue: true
      - key: ZAI_TOKEN
        sync: false
      - key: AGENT_MODE
        value: "true"
      - key: LOG_LEVEL
        value: "info"
    healthCheckPath: /health
    autoDeploy: true
